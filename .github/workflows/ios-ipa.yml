name: iOS IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build-ipa:
    runs-on: macos-26
    env:
      RELEASE_BUILD: 'true'
      RELEASE_PLATFORM: ios
      ADMOB_TESTING: ${{ secrets.ADMOB_TESTING }}
      ADMOB_IOS_APP_ID: ${{ secrets.ADMOB_IOS_APP_ID }}
      ADMOB_IOS_INTERSTITIAL: ${{ secrets.ADMOB_IOS_INTERSTITIAL }}
      REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set store build number
        run: echo "BUILD_NUMBER=$(date -u +%s)" >> "$GITHUB_ENV"
      - run: npm run native:sync
      - name: Install Apple signing assets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "$name secret is missing"; exit 1; }
          done
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/fitness-copilot.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID" || { echo "Provisioning profile team does not match APPLE_TEAM_ID"; exit 1; }
          case "$PROFILE_APP_ID" in *.com.fitnesscopilot.app) ;; *) echo "Provisioning profile app ID does not match com.fitnesscopilot.app"; exit 1;; esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Create export settings
        run: sed -e "s/__APPLE_TEAM_ID__/$APPLE_TEAM_ID/g" -e "s/__PROFILE_NAME__/$PROFILE_NAME/g" ios/ExportOptions.plist.template > ios/ExportOptions.plist
      - name: Archive application
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FitnessCopilot.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_STYLE=Manual CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
      - name: Export IPA
        run: xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FitnessCopilot.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist ios/ExportOptions.plist
      - name: Upload to TestFlight
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        run: |
          for name in APPSTORE_CONNECT_API_KEY_ID APPSTORE_CONNECT_ISSUER_ID APPSTORE_CONNECT_API_KEY_BASE64; do
            test -n "${!name}" || { echo "$name secret is missing"; exit 1; }
          done
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_$APPSTORE_CONNECT_API_KEY_ID.p8"
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          test -n "$IPA_PATH" || { echo "IPA not found"; exit 1; }
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_CONNECT_API_KEY_ID" --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Fitness-Copilot-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
